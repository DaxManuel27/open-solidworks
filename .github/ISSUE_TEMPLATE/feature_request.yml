name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the part or workflow, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: Describe how the feature should behave from the user's point of view.
    validations:
      required: true
