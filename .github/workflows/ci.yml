name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core and desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Configure kernel runtime libraries
        run: |
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: Generated tool types and protocol tables are current
        run: cargo run -q -p openforge -- generate --check
      - run: pnpm install --frozen-lockfile
      - name: Benchmark replay (recorded transcripts, no model calls)
        run: pnpm bench
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - name: Desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @openforge/desktop smoke --no-sandbox
        env:
          OPENFORGE_SMOKE_SCREENSHOT: desktop-smoke.png
      - name: Desktop smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter @openforge/desktop smoke
        env:
          OPENFORGE_SMOKE_SCREENSHOT: desktop-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: apps/desktop/desktop-smoke.png
          if-no-files-found: ignore
