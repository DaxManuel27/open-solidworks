name: CI

# Temporary: diagnose the of-drawing test segfaults on Linux and Windows.
# This branch is deleted once the cause is known.

on:
  push:
    branches: ['phase-5-ci-debug']

jobs:
  crash:
    name: Drawing crash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Configure kernel runtime libraries
        run: |
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the drawing tests
        run: cargo test -p of-drawing --test sheet_corpus --test views --no-run
      - name: Each test alone, one process per test
        continue-on-error: true
        run: |
          for t in sheet_corpus views; do
            for name in $(cargo test -q -p of-drawing --test $t -- --list 2>/dev/null | sed -n 's/: test$//p'); do
              cargo test -q -p of-drawing --test $t -- --exact "$name" >/dev/null 2>&1
              echo "alone $t::$name exit=$?"
            done
          done
      - name: Whole binaries, one thread
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            for t in sheet_corpus views; do
              cargo test -q -p of-drawing --test $t -- --test-threads=1 >/dev/null 2>&1
              echo "serial $t run $i exit=$?"
            done
          done
      - name: Whole binaries, parallel
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            for t in sheet_corpus views; do
              cargo test -q -p of-drawing --test $t >/dev/null 2>&1
              echo "parallel $t run $i exit=$?"
            done
          done
      - name: Native backtrace under gdb
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          command -v gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          for t in sheet_corpus views; do
            bin=$(cargo test -p of-drawing --test $t --no-run 2>&1 | grep -oE "target/debug/deps/$t-[0-9a-f]+" | head -1)
            for i in 1 2 3; do
              echo "=== gdb $t attempt $i"
              (cd crates/of-drawing && gdb -q -batch -ex 'set pagination off' -ex 'set print thread-events off' \
                -ex run -ex 'info threads' -ex 'thread apply all bt 50' --args "../../$bin" --test-threads=4) 2>&1 \
                | tee gdb-$t-$i.txt | grep -vE '^\[(New|Thread)' | tail -400
              grep -q 'SIGSEGV\|SIGABRT' gdb-$t-$i.txt && break
            done
          done
