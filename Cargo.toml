[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DaxManuel27/open-solidworks"

[workspace.dependencies]
of-kernel-sys = { path = "crates/of-kernel-sys" }
of-geom = { path = "crates/of-geom" }
of-sketch = { path = "crates/of-sketch" }
of-model = { path = "crates/of-model" }
of-io = { path = "crates/of-io" }
of-protocol = { path = "crates/of-protocol" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
