[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DaxManuel27/open-solidworks"

[workspace.dependencies]
of-kernel-sys = { path = "crates/of-kernel-sys" }
of-geom = { path = "crates/of-geom" }
of-sketch = { path = "crates/of-sketch" }
of-model = { path = "crates/of-model" }
of-io = { path = "crates/of-io" }
of-protocol = { path = "crates/of-protocol" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
cxx = "1.0"
glam = { version = "0.34", features = ["serde"] }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
